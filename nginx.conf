events{}

http {
    server {
        listen 80;
        server_name emergentes.davant.dev;

        root /usr/share/nginx/html;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }

    # server {
